services:
  - type: web
    name: keyshort
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: REDIS_URL
        sync: false          # Render Key Value or Upstash
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false          # python -m app.security  ->  paste output
      - key: PUBLIC_BASE_URL
        sync: false          # https://keyshort.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: cron
    name: keyshort-keepalive
    runtime: python
    plan: free
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    command: python scripts/keepalive.py
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
