services:
  - type: web
    name: keyshort
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: REDIS_URL
        sync: false          # Render Key Value or Upstash
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false          # npm run generate-key  ->  paste output
      - key: PUBLIC_BASE_URL
        sync: false          # https://keyshort.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NODE_VERSION
        value: "22.x"

  - type: cron
    name: keyshort-keepalive
    runtime: node
    plan: free
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: npm install
    command: npm run keepalive
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
