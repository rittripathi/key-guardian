<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KeyShort{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e8ec;
      --muted: #8a90a2; --accent: #5b8cff; --good: #2fbf71; --bad: #e5484d; --warn: #e5a044;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
    }
    header .brand { font-weight: 700; font-size: 17px; }
    header .brand span { color: var(--accent); }
    nav a { margin-left: 18px; color: var(--muted); font-size: 14px; }
    nav a.active { color: var(--text); }
    main { max-width: 880px; margin: 0 auto; padding: 28px 24px 64px; }
    h1 { font-size: 22px; margin: 0 0 18px; }
    h2 { font-size: 16px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 160px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; background: #0d0f14; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 9px 10px; font-size: 14px; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
    button, .btn {
      display: inline-block; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; padding: 9px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 14px;
    }
    button.secondary, .btn.secondary { background: #262b36; }
    button.danger, .btn.danger { background: var(--bad); }
    button:hover, .btn:hover { opacity: 0.9; text-decoration: none; }
    .error { color: var(--bad); font-size: 13px; margin-top: 8px; }
    .muted { color: var(--muted); }
    .hint { border-bottom: 1px dotted var(--muted); cursor: help; }
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    }
    .badge-good { background: rgba(47,191,113,.15); color: var(--good); }
    .badge-bad { background: rgba(229,72,77,.15); color: var(--bad); }
    .badge-warn { background: rgba(229,160,68,.15); color: var(--warn); }
    .key-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .key-card + .key-card { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
    .alias { font-family: ui-monospace, monospace; font-weight: 700; }
    .bar { height: 5px; border-radius: 3px; background: #262b36; overflow: hidden; margin-top: 4px; }
    .bar > div { height: 100%; background: var(--accent); }
    .bar.danger > div { background: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    pre { background: #0d0f14; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 13px; }
    .inline-form { display: inline; }
    .stat { font-size: 22px; font-weight: 700; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Key<span>Short</span></div>
    {% if user %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/keys/new">New key</a>
      <a href="/alerts">Alerts{% if unread %} ({{ unread }}){% endif %}</a>
      <form class="inline-form" method="post" action="/logout" style="margin-left:18px;">
        <button type="submit" class="secondary" style="margin:0; padding:5px 12px; font-size:13px;">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    KeyShort &middot; short revocable aliases for your API keys<br>
    Built by Rit Tripathi &middot;
    <a href="https://linkedin.com/in/rit-tripathi" target="_blank" rel="noopener">LinkedIn</a>
  </footer>
</body>
</html>
