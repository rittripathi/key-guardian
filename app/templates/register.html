{% extends "base.html" %}
{% block title %}Register &middot; KeyShort{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin:60px auto 0;">
  <h1>Create your account</h1>
  <form method="post" action="/register">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">
    <p class="muted" style="font-size:12px; margin:4px 0 0;">At least 8 characters.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit" style="width:100%;">Register</button>
  </form>
  <p class="muted" style="margin-top:14px; font-size:13px;">
    Already have an account? <a href="/login">Log in</a>
  </p>
</div>
{% endblock %}
